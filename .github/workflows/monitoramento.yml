name: Monitor de Passagens

on:
  # Executa automaticamente via agendamento (cron)
  schedule:
    # Roda a cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  
  # Permite rodar manualmente a qualquer momento pelo GitHub
  workflow_dispatch:

jobs:
  buscar-passagens:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar script de busca
        env:
          # Associa a Secret que você criou à variável que o script lê
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python monitor-voo.py
